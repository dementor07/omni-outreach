# Omni v2 — runs alongside prod master on the same VPS, sharing
# Postgres + Redpanda + Dragonfly (Redis API). Different ports, different
# nginx vhost, no shared container names. See ADR 0001.
#
# Deploy:
#   docker compose -p omni-v2 -f docker-compose.v2.yml up -d --build
#
# Prod master continues running under the default project (-p omni-outreach)
# on the same host. Nothing here recreates a prod container.
#
# DEPLOY-006: secrets are NOT inlined here anymore — they come from the
# gitignored .env via ${VAR} interpolation (compose auto-loads .env). See
# .env for the variable list. Rotate any value that was ever committed.

x-secret-env: &secret-env
  DATABASE_URL: ${DATABASE_URL}
  KAFKA_BROKERS: ${KAFKA_BROKERS}
  DB_PASSWORD: ${DB_PASSWORD}
  SECRET_KEY: ${SECRET_KEY}

services:
  # DEPLOY-003: pre-create the topics with intentional partition counts instead
  # of relying on Redpanda implicit auto-create (which lands every topic at 1
  # partition — an accidental capacity cap). Runs once and exits; other services
  # don't hard-depend on it (topics also auto-create) but running it makes the
  # partitioning a deliberate decision. Idempotent: `create` is a no-op if the
  # topic exists.
  topics-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: omni-v2-topics-init
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      'until rpk cluster info --brokers redpanda:9092 >/dev/null 2>&1; do echo waiting for redpanda; sleep 2; done &&
       rpk topic create omni.events         -p 6 -r 1 --brokers redpanda:9092 || true &&
       rpk topic create outreach.commands    -p 6 -r 1 --brokers redpanda:9092 || true &&
       rpk topic create outreach.results     -p 6 -r 1 --brokers redpanda:9092 || true &&
       rpk topic create outreach.transitions -p 6 -r 1 --brokers redpanda:9092 || true &&
       rpk topic create outreach.dead_letter -p 1 -r 1 --brokers redpanda:9092 || true &&
       echo topics-init done'
    networks:
      - omni-outreach_default
    restart: "no"

  backend-v2:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: omni-v2-backend
    env_file:
      - .env
    environment:
      <<: *secret-env
      # Shared infra (joins the master compose network via external network below)
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MUSCLE_SHARED_SECRET: ${MUSCLE_SHARED_SECRET:-dev-muscle-secret-rotate-me}
      FRONTEND_URL: ${FRONTEND_URL}
    networks:
      - omni-outreach_default
    ports:
      - "8001:8000"
    restart: unless-stopped

  projector-v2:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: omni-v2-projector
    command: python -m app.projector.main
    env_file:
      - .env
    environment:
      <<: *secret-env
    networks:
      - omni-outreach_default
    # Background worker — the image's HEALTHCHECK curls :8000 which only the
    # FastAPI backend serves. Disable so docker doesn't mark this unhealthy.
    healthcheck:
      disable: true
    restart: unless-stopped

  # The execution worker (Rust). Consumes outreach.commands, performs the
  # real I/O per channel handler, emits outreach.results. CONTROL_PLANE_URL
  # points at the v2 backend so credential refs resolve against v2 connections.
  muscle-v2:
    build:
      context: ./backend-rust
    container_name: omni-v2-muscle
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      DATABASE_URL: ${DATABASE_URL}
      CONTROL_PLANE_URL: http://backend-v2:8000
      MUSCLE_SHARED_SECRET: ${MUSCLE_SHARED_SECRET:-dev-muscle-secret-rotate-me}
      # Don't share the consumer group with the legacy execution engine —
      # otherwise the older muscle eats v2 commands and dies on unknown
      # channel variants. See main.rs for the override hook.
      MUSCLE_CONSUMER_GROUP: muscle-v2
      RUST_LOG: execution_engine=info,info
    networks:
      - omni-outreach_default
    restart: unless-stopped

  # Dispatcher: enrolls leads and turns the lead's current node into an
  # ActionCommand on outreach.commands (resolves channel, renders payload,
  # mints a one-shot credential_ref). Consumes lead-enrollment + transition
  # advancement requests.
  dispatcher-v2:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: omni-v2-dispatcher
    command: python -m app.execution.dispatcher
    env_file:
      - .env
    environment:
      <<: *secret-env
      MUSCLE_SHARED_SECRET: ${MUSCLE_SHARED_SECRET:-dev-muscle-secret-rotate-me}
    networks:
      - omni-outreach_default
    healthcheck:
      disable: true
    restart: unless-stopped

  # Transition worker: consumes outreach.transitions (emitted by the Flink
  # orchestrator), walks the canvas edge for (source_node_id, handle), sets
  # the lead's next node, and asks the dispatcher to fire it.
  transitions-v2:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: omni-v2-transitions
    command: python -m app.execution.transition_worker
    env_file:
      - .env
    environment:
      <<: *secret-env
      # DEPLOY-005: this worker can mint credential refs (via the dispatcher
      # path it shares), so it must carry the same shared secret as the others.
      MUSCLE_SHARED_SECRET: ${MUSCLE_SHARED_SECRET:-dev-muscle-secret-rotate-me}
    networks:
      - omni-outreach_default
    healthcheck:
      disable: true
    restart: unless-stopped

  # Submits the pyflink orchestrator job (outreach.results -> outreach.transitions)
  # to the shared Flink jobmanager from the master stack. Idempotent enough:
  # if the job is already registered a duplicate submit fails and we tail; the
  # registered job survives. Restart re-submits if the cluster was wiped.
  orchestrator-v2:
    build:
      context: ./backend-flink
    container_name: omni-v2-orchestrator
    command: sh -lc "until curl -fsS http://flink-jobmanager:8081/overview >/dev/null 2>&1; do echo waiting for jobmanager; sleep 3; done && (flink run -d -m flink-jobmanager:8081 -py /opt/flink/usrlib/orchestrator.py || echo 'submit failed (job may already be running)') && tail -f /dev/null"
    environment:
      - KAFKA_BROKERS=redpanda:9092
    networks:
      - omni-outreach_default
    restart: unless-stopped

  frontend-v2:
    build:
      context: ./frontend
      dockerfile: Dockerfile.v2
    container_name: omni-v2-frontend
    networks:
      - omni-outreach_default
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./acme:/var/www/certbot
    restart: unless-stopped

# Join master's docker-compose network so we can talk to db, redpanda, redis
# by their service names without exposing them.
networks:
  omni-outreach_default:
    external: true
