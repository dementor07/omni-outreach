version: '3.8'

services:
  # --- The Spine (Event Bus) ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"

  # --- The Memory (State & Cache) ---
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass d02ab4ba5a242eb8ae8fea88c7aec39a087655ee0b98ee17
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: OmniOutreach2026
      POSTGRES_USER: outreach
      POSTGRES_DB: outreach
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # --- The Muscle (Rust Execution) ---
  execution-engine:
    build:
      context: ./backend-rust
    environment:
      KAFKA_BROKERS: redpanda:9092
      DATABASE_URL: postgresql://outreach:OmniOutreach2026@db:5432/outreach
    depends_on:
      - redpanda
      - db

  # --- The Lungs (Flink Orchestration) ---
  flink-jobmanager:
    build:
      context: ./backend-flink
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      - redpanda

  flink-taskmanager:
    build:
      context: ./backend-flink
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
      - KAFKA_BROKERS=redpanda:9092

  # --- The Brain (Python Control Plane) ---
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://outreach:OmniOutreach2026@db:5432/outreach
      REDIS_URL: redis://:d02ab4ba5a242eb8ae8fea88c7aec39a087655ee0b98ee17@redis:6379
      KAFKA_BROKERS: redpanda:9092
      DB_PASSWORD: OmniOutreach2026
      SECRET_KEY: 28004f81bdcfcb293be3e782b714b421c7e9e0d6235c346a4252ef7a18b041bb
    depends_on:
      - db
      - redpanda
      - redis
    volumes:
      - ./scripts:/app/scripts
    ports:
      - "8000:8000"

  # --- SOTA Bridge Workers ---
  sync-worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: python -m app.services.stream_sync
    environment:
      DATABASE_URL: postgresql://outreach:OmniOutreach2026@db:5432/outreach
      KAFKA_BROKERS: redpanda:9092
      REDIS_URL: redis://:d02ab4ba5a242eb8ae8fea88c7aec39a087655ee0b98ee17@redis:6379
    depends_on:
      - db
      - redpanda
      - redis

  transition-worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: python -m app.services.transition_worker
    environment:
      DATABASE_URL: postgresql://outreach:OmniOutreach2026@db:5432/outreach
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - db
      - redpanda

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
    external: true
    name: omni-outreach_pgdata
  redisdata:
    external: true
    name: omni-outreach_redisdata
