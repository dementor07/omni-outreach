version: '3.8'

services:
  # --- The Spine (Event Bus) ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"

  # --- The Memory (State & Cache) ---
  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  # --- The Muscle (Rust Execution) ---
  execution-engine:
    build:
      context: ./backend-rust
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - redpanda

  # --- The Lungs (Flink Orchestration) ---
  flink-jobmanager:
    build:
      context: ./backend-flink
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
      - KAFKA_BROKERS=redpanda:9092

  flink-taskmanager:
    build:
      context: ./backend-flink
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
      - KAFKA_BROKERS=redpanda:9092

  # --- The Brain (Python Control Plane) ---
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/postgres
      REDIS_URL: redis://dragonfly:6379
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - postgres
      - redpanda
      - dragonfly
    volumes:
      - ./scripts:/app/scripts
    ports:
      - "8000:8000"

  # --- SOTA Bridge Workers ---
  sync-worker:
    build:
      context: ./backend
    command: python -m app.services.stream_sync
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/postgres
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - postgres
      - redpanda

  transition-worker:
    build:
      context: ./backend
    command: python -m app.services.transition_worker
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/postgres
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - postgres
      - redpanda

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
