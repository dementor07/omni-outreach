version: '3.8'

services:
  # --- The Spine (Event Bus) ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --memory 1G
    ports:
      - "19092:19092"

  # --- The Memory (State & Cache) ---
  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: ["--requirepass", "d02ab4ba5a242eb8ae8fea88c7aec39a087655ee0b98ee17"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: OmniOutreach2026
      POSTGRES_USER: outreach
      POSTGRES_DB: outreach
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # --- The Muscle (Rust Execution) ---
  execution-engine:
    build:
      context: ./backend-rust
    environment:
      KAFKA_BROKERS: redpanda:9092
      DATABASE_URL: postgresql://outreach:OmniOutreach2026@db:5432/outreach
      CONTROL_PLANE_URL: http://backend:8000
      MUSCLE_SHARED_SECRET: ${MUSCLE_SHARED_SECRET:-dev-muscle-secret-rotate-me}
      RUST_LOG: execution_engine=info
    depends_on:
      - redpanda
      - db
      - backend

  # --- The Lungs (Flink Orchestration) ---
  flink-jobmanager:
    build:
      context: ./backend-flink
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      - redpanda

  flink-taskmanager:
    build:
      context: ./backend-flink
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      # Slot budget: orchestrator DataStream pipeline (2 slots) + daily SQL
      # window (1) + channel-mix SQL window (1) = 4. Headroom for one extra
      # SQL job before we need a second TaskManager.
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 6
      - KAFKA_BROKERS=redpanda:9092

  journey-orchestrator:
    build:
      context: ./backend-flink
    command: sh -lc "flink run -d -m flink-jobmanager:8081 -py /opt/flink/usrlib/orchestrator.py && tail -f /dev/null"
    environment:
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      - redpanda
      - flink-jobmanager
      - flink-taskmanager
    restart: unless-stopped

  # Submits the Flink SQL analytics pipeline (Redpanda → tumbling windows →
  # Dragonfly). One-shot submitter — once the job is registered with the
  # JobManager it survives container restarts.
  flink-sql-runner:
    build:
      context: ./backend-flink
    # Point this sql-client at the real JobManager. The `-m` flag is advisory
    # in 1.18 — actual job submission resolves via flink-conf.yaml, so we
    # write the right `jobmanager.rpc.address` + `rest.address` into the
    # container's conf before starting the client.
    command: ["sh", "-lc", "until curl -fsS http://flink-jobmanager:8081/overview >/dev/null 2>&1; do echo waiting for jobmanager; sleep 3; done && sleep 5 && sed -i 's|^jobmanager.rpc.address.*|jobmanager.rpc.address: flink-jobmanager|; s|^rest.address.*|rest.address: flink-jobmanager|' /opt/flink/conf/flink-conf.yaml && grep -E 'jobmanager.rpc.address|rest.address' /opt/flink/conf/flink-conf.yaml && /opt/flink/bin/sql-client.sh -f /opt/flink/usrlib/analytics.sql && tail -f /dev/null"]
    environment:
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      - flink-jobmanager
      - flink-taskmanager
      - redpanda
      - db
    restart: on-failure

  # --- The Brain (Python Control Plane) ---
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    # .env carries the optional lead-source API keys (APOLLO_API_KEY,
    # HUNTER_API_KEY, PRODUCTHUNT_TOKEN, …). `environment:` below overrides
    # what we want pinned in compose (DB, Redis, etc.).
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://outreach:OmniOutreach2026@db:5432/outreach
      REDIS_URL: redis://:d02ab4ba5a242eb8ae8fea88c7aec39a087655ee0b98ee17@redis:6379
      REDIS_PASSWORD: d02ab4ba5a242eb8ae8fea88c7aec39a087655ee0b98ee17
      KAFKA_BROKERS: redpanda:9092
      DB_PASSWORD: OmniOutreach2026
      SECRET_KEY: 28004f81bdcfcb293be3e782b714b421c7e9e0d6235c346a4252ef7a18b041bb
      MUSCLE_SHARED_SECRET: ${MUSCLE_SHARED_SECRET:-dev-muscle-secret-rotate-me}
      # Per-channel cutover allowlist. Channels in this list flow exclusively
      # through the Rust muscle (no Python queue insert). Empty = legacy path
      # for everything. Start with email+linkedin_invite and expand.
      CHANNEL_MUSCLE_MODE: ${CHANNEL_MUSCLE_MODE:-email,linkedin_invite}
    depends_on:
      - db
      - redpanda
      - redis
    volumes:
      - ./scripts:/app/scripts
    ports:
      - "8000:8000"

  # --- SOTA Bridge Workers ---
  sync-worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: python -m app.services.stream_sync
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://outreach:OmniOutreach2026@db:5432/outreach
      KAFKA_BROKERS: redpanda:9092
      REDIS_URL: redis://:d02ab4ba5a242eb8ae8fea88c7aec39a087655ee0b98ee17@redis:6379
      REDIS_PASSWORD: d02ab4ba5a242eb8ae8fea88c7aec39a087655ee0b98ee17
    depends_on:
      - db
      - redpanda
      - redis
    healthcheck:
      disable: true

  transition-worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: python -m app.services.transition_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://outreach:OmniOutreach2026@db:5432/outreach
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - db
      - redpanda
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./certs:/etc/nginx/certs:ro

volumes:
  pgdata:
    external: true
    name: omni-outreach_pgdata
  redisdata:
    external: true
    name: omni-outreach_redisdata
