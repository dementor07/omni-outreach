name: CI

on:
  push:
    # Feature branches use proportional local checks. The production branch is
    # released deliberately through workflow_dispatch below, so a fast-forward
    # must not start a second, non-deploying copy of the same pipeline.
    branches: [master]
  pull_request:
    branches: [master, phase-out-non-v2]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated v2 services to rebuild and recreate"
        required: true
        type: string
      run_migrations:
        description: "Run Alembic from the freshly built backend-v2 image"
        required: true
        default: false
        type: boolean
      run_tests:
        description: "Run backend integration tests before deploy (required for backend/schema/auth/hot-path changes)"
        required: true
        default: true
        type: boolean

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff
      - name: Lint backend
        run: ruff check backend/

  test:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'workflow_dispatch' || inputs.run_tests == true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: outreach_test
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:latest
        ports: ["9092:9092", "19092:19092"]
        command: >-
          redpanda start --smp 1 --overprovisioned 
          --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 
          --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    env:
      DATABASE_URL: postgresql://outreach:testpass@localhost:5432/outreach_test
      DB_PASSWORD: testpass
      SECRET_KEY: ci-test-secret-key-not-for-production
      REDIS_PASSWORD: ""
      KAFKA_BROKERS: localhost:19092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff aiokafka
      - name: Init database
        run: |
          PGPASSWORD=testpass psql -h localhost -U outreach -d outreach_test -f backend/schema.sql
      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Production releases are deliberate and service-scoped. A merge/push must
    # never restart the live app plane while campaigns are active.
    if: >-
      always() &&
      github.ref == 'refs/heads/phase-out-non-v2' &&
      github.event_name == 'workflow_dispatch' &&
      needs.lint.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    env:
      DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
      DEPLOY_SERVICES: ${{ inputs.services }}
      RUN_MIGRATIONS: ${{ inputs.run_migrations }}
    steps:
      - name: Check deploy configuration
        id: deploy_config
        run: |
          if [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::notice::DEPLOY_WEBHOOK_SECRET is not configured; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start scoped deployment
        if: steps.deploy_config.outputs.ready == 'true'
        run: |
          curl -sf \
            --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_SECRET" \
            -H "X-Deploy-Operation: start" \
            -H "X-Deploy-SHA: $GITHUB_SHA" \
            -H "X-Deploy-Services: $DEPLOY_SERVICES" \
            -H "X-Run-Migrations: $RUN_MIGRATIONS" \
            https://13-140-169-62.sslip.io/deploy

      - name: Wait for scoped deployment
        if: steps.deploy_config.outputs.ready == 'true'
        run: |
          for attempt in $(seq 1 90); do
            response="$(curl -sf \
              --max-time 15 \
              -X POST \
              -H "Authorization: Bearer $DEPLOY_WEBHOOK_SECRET" \
              -H "X-Deploy-Operation: status" \
              -H "X-Deploy-SHA: $GITHUB_SHA" \
              https://13-140-169-62.sslip.io/deploy)" || {
                sleep 10
                continue
              }
            state="$(python -c 'import json,sys; print(json.load(sys.stdin)["state"])' <<< "$response")"
            if [ "$state" = "succeeded" ]; then
              echo "Deployment completed for $GITHUB_SHA"
              exit 0
            fi
            if [ "$state" = "failed" ]; then
              echo "Deployment failed; inspect deploy-webhook.service on the VPS."
              exit 1
            fi
            sleep 10
          done
          echo "Deployment status timed out for $GITHUB_SHA"
          exit 1

      - name: Report skipped deploy
        if: steps.deploy_config.outputs.ready != 'true'
        run: echo "Deploy skipped — add DEPLOY_WEBHOOK_SECRET to repository secrets to enable."
