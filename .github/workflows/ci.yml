name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff
      - name: Lint backend
        run: ruff check backend/

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: outreach_test
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outreach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://outreach:testpass@localhost:5432/outreach_test
      DB_PASSWORD: testpass
      SECRET_KEY: ci-test-secret-key-not-for-production
      REDIS_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff
      - name: Init database
        run: |
          PGPASSWORD=testpass psql -h localhost -U outreach -d outreach_test -f backend/schema.sql
      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t omni-outreach-backend ./backend
      - name: Build frontend image
        run: docker build -t omni-outreach-frontend ./frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    env:
      DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
    steps:
      - name: Check deploy configuration
        id: deploy_config
        run: |
          if [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::notice::DEPLOY_WEBHOOK_SECRET is not configured; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to VPS
        if: steps.deploy_config.outputs.ready == 'true'
        run: |
          curl -sf \
            --max-time 300 \
            -X POST \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_SECRET" \
            https://srv1575227.hstgr.cloud/deploy

      - name: Report skipped deploy
        if: steps.deploy_config.outputs.ready != 'true'
        run: echo "Deploy skipped — add DEPLOY_WEBHOOK_SECRET to repository secrets to enable."
