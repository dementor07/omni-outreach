name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff
      - name: Lint backend
        run: ruff check backend/

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: outreach_test
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outreach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://outreach:testpass@localhost:5432/outreach_test
      DB_PASSWORD: testpass
      SECRET_KEY: ci-test-secret-key-not-for-production
      REDIS_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff
      - name: Init database
        run: |
          PGPASSWORD=testpass psql -h localhost -U outreach -d outreach_test -f backend/schema.sql
      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t omni-outreach-backend ./backend
      - name: Build frontend image
        run: docker build -t omni-outreach-frontend ./frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Check deploy configuration
        id: deploy_config
        run: |
          missing=0
          for var in VPS_HOST VPS_DEPLOY_USER VPS_SSH_KEY; do
            if [ -z "${!var}" ]; then
              echo "::notice::${var} is not configured; skipping deploy."
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to VPS
        if: steps.deploy_config.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_DEPLOY_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            cd /home/omni-outreach
            git pull origin master
            docker compose up -d --build
            docker compose exec -T backend alembic upgrade head
            echo "Deploy complete at $(date)"

      - name: Report skipped deploy
        if: steps.deploy_config.outputs.ready != 'true'
        run: echo "Deploy skipped because VPS deploy secrets are not configured."
