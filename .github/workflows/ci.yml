name: CI

on:
  push:
    branches: [master, phase-out-non-v2]
  pull_request:
    branches: [master, phase-out-non-v2]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff
      - name: Lint backend
        run: ruff check backend/

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: outreach_test
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:latest
        ports: ["9092:9092", "19092:19092"]
        command: >-
          redpanda start --smp 1 --overprovisioned 
          --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 
          --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    env:
      DATABASE_URL: postgresql://outreach:testpass@localhost:5432/outreach_test
      DB_PASSWORD: testpass
      SECRET_KEY: ci-test-secret-key-not-for-production
      REDIS_PASSWORD: ""
      KAFKA_BROKERS: localhost:19092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff aiokafka
      - name: Init database
        run: |
          PGPASSWORD=testpass psql -h localhost -U outreach -d outreach_test -f backend/schema.sql
      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        # The backend Dockerfile references paths like `backend/app` and
        # `scripts/`, so the build context must be the repo root — matching
        # docker-compose.yml which uses `context: .` + `dockerfile: ./backend/Dockerfile`.
        run: docker build --build-arg BUILD_SHA="$GITHUB_SHA" -t "omni-outreach-backend:$GITHUB_SHA" -f backend/Dockerfile .
      - name: Build frontend image
        run: docker build --build-arg BUILD_SHA="$GITHUB_SHA" -t "omni-outreach-frontend:$GITHUB_SHA" -f frontend/Dockerfile.v2 frontend
      - name: Build rust muscle image
        run: docker build --build-arg BUILD_SHA="$GITHUB_SHA" -t "omni-outreach-rust:$GITHUB_SHA" ./backend-rust
      - name: Build flink lungs image
        run: docker build --build-arg BUILD_SHA="$GITHUB_SHA" -t "omni-outreach-flink:$GITHUB_SHA" ./backend-flink

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/phase-out-non-v2') && github.event_name == 'push'
    env:
      DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
    steps:
      - name: Check deploy configuration
        id: deploy_config
        run: |
          if [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::notice::DEPLOY_WEBHOOK_SECRET is not configured; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to VPS
        if: steps.deploy_config.outputs.ready == 'true'
        run: |
          curl -sf \
            --max-time 300 \
            -X POST \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_SECRET" \
            -H "X-Deploy-SHA: $GITHUB_SHA" \
            https://13-140-169-62.sslip.io/deploy

      - name: Report skipped deploy
        if: steps.deploy_config.outputs.ready != 'true'
        run: echo "Deploy skipped — add DEPLOY_WEBHOOK_SECRET to repository secrets to enable."
