[package]
name = "execution-engine"
version = "0.2.0"
edition = "2021"

[dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.4", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Network & APIs
reqwest = { version = "0.11", features = ["json", "socks", "multipart"] }
url = "2.5"

# Email
lettre = { version = "0.10.4", features = ["tokio1-native-tls", "smtp-transport", "builder"] }

# Messaging
rdkafka = { version = "0.33" }

# Database (for the idempotency ledger only — never for hot-path content)
sqlx = { version = "0.7.1", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "json"] }

# Credential ref redemption (HMAC-signed bearer to the control plane)
once_cell = "1.19"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
